[package]
name = "qms-faucet-bot"
version = "0.1.6"
edition = "2021"
description = "QMS testnet faucet automation bot"
license = "Apache-2.0"

[[bin]]
name = "qms-faucet-bot"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
chrono = "0.4"
reqwest = { version = "0.11", features = ["socks", "rustls-tls", "json", "gzip"], default-features = false }
rand = "0.8"
argon2 = { version = "0.5", features = ["std"] }
rayon = "1.10"
base64 = "0.22"
tokio-socks = "0.5"
rustls = "0.22"
webpki-roots = "0.26"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
